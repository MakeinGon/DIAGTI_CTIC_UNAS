# ============================================================
# BASE DE DATOS
# Compatible con Docker Compose local y Render
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:diagti_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Postgres123*}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeño para la instancia gratuita de Render.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway permanece desactivado porque la inicialización se realiza con
# DataBase/init.sql desde render-entrypoint.sh.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# Archivos de evidencia.
app.uploads.path=${APP_UPLOADS_PATH:uploads/evidencias}

# Actuator
management.endpoints.web.exposure.include=health,info

# En Render el backend queda interno en 8080 y Nginx escucha el PORT público.
server.port=${BACKEND_PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/
server.forward-headers-strategy=framework
