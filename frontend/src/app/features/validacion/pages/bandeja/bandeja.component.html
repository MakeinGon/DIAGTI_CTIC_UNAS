<div class="page">

  <div class="page-header">
    <h1>Validación Técnica</h1>
    <p>Gestión y revisión de sistemas informáticos registrados</p>
  </div>

  <div class="card">

    <div class="filters">

      <input
        type="search"
        placeholder="Buscar por código, sistema o área..."
        [(ngModel)]="search"
        (input)="onSearch()"
      />

      <select (change)="onFilterEstado($event)">
        <option value="">Todos los estados</option>
        <option *ngFor="let e of estados" [value]="e">
          {{ e }}
        </option>
      </select>

    </div>

    <table class="tabla">

      <thead>
        <tr>
          <th (click)="setSort('codigo')">Código</th>
          <th (click)="setSort('nombre')">Sistema</th>
          <th (click)="setSort('area')">Área</th>
          <th (click)="setSort('estado')">Estado</th>
          <th (click)="setSort('riesgo')">Riesgo</th>
          <th>Evidencias</th>
          <th>Acción</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let it of paged">

          <td>{{ it.codigo }}</td>

          <td>
            <strong>{{ it.nombre }}</strong>
          </td>

          <td>{{ it.area }}</td>

          <td>
            <span
              class="badge"
              [ngClass]="'estado-' + it.estado">
              {{ it.estado }}
            </span>
          </td>

          <td>
            <span
              class="badge"
              [ngClass]="'riesgo-' + it.riesgo">
              {{ it.riesgo }}
            </span>
          </td>

          <td>{{ it.evidencias }}</td>

          <td>
            <button
              class="btn-review"
              (click)="goTo(it.id)">
              Revisar
            </button>
          </td>

        </tr>

      </tbody>

    </table>

    <div class="pagination">

      <button
        (click)="page = page - 1"
        [disabled]="page <= 1">

        Anterior

      </button>

      <span>
        Página {{ page }} de {{ totalPages() }}
      </span>

      <button
        (click)="page = page + 1"
        [disabled]="page >= totalPages()">

        Siguiente

      </button>

    </div>

  </div>

</div>
