<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/pages/infraestructura/assets/logo-unas.png?v=13">
    <title>Redirigiendo a Pendientes | DIAGTI - CTIC</title>
    
    <!-- Font Awesome para el ícono -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .redirect-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            max-width: 500px;
            width: 90%;
        }
        
        .redirect-icon {
            font-size: 56px;
            color: #0f75bc;
            margin-bottom: 20px;
        }
        
        .redirect-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2a2e;
            margin-bottom: 10px;
        }
        
        .redirect-subtitle {
            font-size: 16px;
            color: #64757a;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .redirect-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #dfe6e5;
            border-top: 4px solid #1abb9c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        
        .redirect-link {
            display: inline-block;
            padding: 12px 32px;
            background: #1abb9c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .redirect-link:hover {
            background: #149174;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 187, 156, 0.3);
        }
        
        .redirect-link i {
            margin-right: 8px;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .redirect-note {
            margin-top: 16px;
            font-size: 12px;
            color: #64757a;
        }
        
        .redirect-note strong {
            color: #1f2a2e;
        }
    </style>
</head>
<body>

    <div class="redirect-container">
        <!-- Ícono -->
        <div class="redirect-icon">
            <i class="fas fa-arrow-right"></i>
        </div>
        
        <!-- Título -->
        <h1 class="redirect-title">Redirigiendo a Pendientes</h1>
        
        <!-- Subtítulo -->
        <p class="redirect-subtitle">
            La página de <strong>Detalle del Sistema</strong> ya no es necesaria.
            Ahora puedes ver toda la información desde el panel lateral en la 
            <strong>Bandeja de Pendientes</strong>.
        </p>
        
        <!-- Spinner -->
        <div class="redirect-spinner"></div>
        
        <!-- Botón manual -->
        <a href="pendientes.html" class="redirect-link">
            <i class="fas fa-arrow-left"></i> Ir a Pendientes
        </a>
        
        <!-- Nota -->
        <p class="redirect-note">
            Serás redirigido automáticamente en <strong id="contador">5</strong> segundos.
        </p>
    </div>

    <script>
        // Contador regresivo
        let segundos = 5;
        const contadorElement = document.getElementById('contador');
        
        const intervalo = setInterval(() => {
            segundos--;
            if (contadorElement) {
                contadorElement.textContent = segundos;
            }
            if (segundos <= 0) {
                clearInterval(intervalo);
                window.location.href = 'pendientes.html';
            }
        }, 1000);
        
        // Redirección inmediata con meta refresh (fallback)
        setTimeout(() => {
            window.location.href = 'pendientes.html';
        }, 5500);
    </script>

</body>
</html>
