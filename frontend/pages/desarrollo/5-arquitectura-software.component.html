<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso 5 - Arquitectura de Software</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --color-verde-ctic: #1abb9c; --color-azul-ctic: #0f75bc; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; }
    .container-arquitectura { max-width: 1100px; margin: 2rem auto; animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .card-custom { border: none; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
    .card-header-main { background: linear-gradient(135deg, var(--color-azul-ctic), #0a5a9c); color: white; padding: 1.25rem 1.75rem; border-radius: 16px 16px 0 0; }
    .section-title { border-left: 5px solid var(--color-verde-ctic); padding-left: 10px; font-weight: 700; color: #212529; margin-bottom: 1.5rem; }
    .btn-verde { background-color: var(--color-verde-ctic); border: none; padding: 10px 24px; font-weight: 600; border-radius: 8px; color: white; }
    .btn-verde:hover { background-color: #16a589; color: white; }
  </style>
</head>
<body>
<div class="container-arquitectura">
  <div class="card card-custom">
    <div class="card-header-main text-white">
      <div class="d-flex align-items-center">
        <i class="bi bi-cpu-fill me-3 fs-3"></i>
        <h5 class="mb-0 fw-bold">5. Registro de Componentes y Arquitectura de Software</h5>
      </div>
    </div>
    <div class="card-body p-4 p-md-5">
      <form id="formArquitectura" onsubmit="event.preventDefault(); alert('✅ Ficha de arquitectura tecnológica registrada de manera exitosa.');">
        
        <h6 class="section-title">Ficha Tecnológica Core (RF-07)</h6>
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label fw-bold">Lenguaje de Programación Principal <span class="text-danger">*</span></label>
            <input type="text" class="form-control" placeholder="Ej: Java, PHP, TypeScript" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Versión Exacta del Lenguaje <span class="text-danger">*</span></label>
            <input type="text" class="form-control" placeholder="Ej: 17 LTS, 8.2" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Framework Utilizado</label>
            <input type="text" class="form-control" placeholder="Ej: Spring Boot, Laravel, Angular">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Versión del Framework</label>
            <input type="text" class="form-control" placeholder="Ej: 3.2.4, 10.x">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Patrón de Diseño / Arquitectura Base</label>
            <select class="form-select">
              <option selected>Arquitectura Limpia (Clean Architecture)</option>
              <option>Modelo-Vista-Controlador (MVC)</option>
              <option>Microservicios Desacoplados</option>
              <option>Monolítico Tradicional</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Repositorio Oficial de Código (Git) <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-github"></i></span>
              <input type="url" class="form-control" placeholder="https://github.com/..." required>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Tecnologías Complementarias / Librerías Críticas</label>
            <textarea class="form-control" rows="2" placeholder="Detalle librerías complementarias (Ej: Maven, Jackson, JWT Core, Webflux)..."></textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="card-footer bg-light d-flex justify-content-between py-4 px-5">
      <button type="button" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Atrás</button>
      <button type="submit" form="formArquitectura" class="btn btn-verde text-white px-5">Guardar Arquitectura y Continuar</button>
    </div>
  </div>
</div>
</body>
</html>
