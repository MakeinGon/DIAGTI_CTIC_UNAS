<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso 3 - Registrar Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --color-verde-ctic: #1abb9c; --color-azul-ctic: #0f75bc; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; }
    .container-form { max-width: 1100px; margin: 2rem auto; animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .card-custom { border: none; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
    .card-header-main { background: linear-gradient(135deg, var(--color-azul-ctic), #0a5a9c); color: white; padding: 1.25rem 1.75rem; border-radius: 16px 16px 0 0; }
    .section-title { border-left: 5px solid var(--color-verde-ctic); padding-left: 10px; font-weight: 700; color: #212529; margin-bottom: 1.5rem; }
    .btn-verde { background-color: var(--color-verde-ctic); border: none; padding: 10px 24px; font-weight: 600; border-radius: 8px; color: white; }
    .btn-verde:hover { background-color: #16a589; color: white; }
  </style>
</head>
<body>
<div class="container-form">
  <div class="card card-custom">
    <div class="card-header-main text-white">
      <div class="d-flex align-items-center">
        <i class="bi bi-folder-plus me-3 fs-3"></i>
        <h5 class="mb-0 fw-bold">3. Formulario de Registro de Nuevo Sistema Informático</h5>
      </div>
    </div>
    <div class="card-body p-4 p-md-5">
      <form id="formRegistro" onsubmit="event.preventDefault(); alert('✅ RN-01 Validada: Código único institucional guardado correctamente en el lote de datos.');">
        
        <!-- Sección 1: Datos Generales (RF-04) -->
        <h6 class="section-title">Ficha Informativa General (RF-04)</h6>
        <div class="row g-4 mb-4">
          <div class="col-md-4">
            <label class="form-label fw-bold">Código Único Institucional <span class="text-danger">*</span></label>
            <input type="text" class="form-control" placeholder="Ej: SIS-SGI-01" required>
            <div class="form-text">Debe cumplir de manera estricta la restricción única RN-01.</div>
          </div>
          <div class="col-md-8">
            <label class="form-label fw-bold">Nombre del Sistema <span class="text-danger">*</span></label>
            <input type="text" class="form-control" placeholder="Nombre completo del aplicativo informático" required>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Descripción Operativa <span class="text-danger">*</span></label>
            <textarea class="form-control" rows="3" placeholder="Detalle los objetivos del sistema y las funciones institucionales que automatiza..." required></textarea>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Área Usuaria Beneficiaria</label>
            <select class="form-select">
              <option selected>CTIC - Centro de Cómputo</option>
              <option>Área de Desarrollo de Software</option>
              <option>Infraestructura de Redes</option>
              <option>Rectorado / Directivos</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Clasificación del Tipo de Aplicativo (RF-05)</label>
            <select class="form-select" required>
              <option selected value="WEB">Aplicativo Web Interno / Intranet</option>
              <option value="DESKTOP">Aplicación de Escritorio (Desktop)</option>
              <option value="MOVIL">Aplicativo Móvil Nativo</option>
              <option value="API">API REST / Servicio Interno Core</option>
              <option value="LEGACY">Sistema Legacy / Heredado</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Nivel de Criticidad</label>
            <select class="form-select">
              <option value="BAJO">Bajo (Monitoreo regular)</option>
              <option value="MEDIO">Medio (Soporte en cola)</option>
              <option selected value="ALTO">Alto (Impacto Crítico Institucional)</option>
            </select>
          </div>
        </div>

        <!-- Sección 2: Ficha Contractual (RF-06) -->
        <h6 class="section-title mt-5">Gestión de Adquisición y Soporte Contractual (RF-06)</h6>
        <div class="row g-4">
          <div class="col-md-4">
            <label class="form-label fw-bold">Forma de Adquisición</label>
            <select class="form-select">
              <option selected>Desarrollado de manera interna por el CTIC</option>
              <option>Adquisición por Proveedor Externo</option>
              <option>Convenio Interinstitucional</option>
              <option>Compra Directa por Proyecto</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Empresa o Persona Desarrolladora</label>
            <input type="text" class="form-control" value="Equipo de Desarrollo Local CTIC">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Año de Puesta en Producción</label>
            <input type="number" class="form-control" value="2026">
          </div>
          <div class="col-md-6">
            <div class="form-check form-switch mt-4 pt-2">
              <input class="form-check-input" type="checkbox" id="contratoCheck" checked>
              <label class="form-check-label fw-bold" for="contratoCheck">¿Cuenta con Contrato de Soporte Técnico Vigente?</label>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Fecha de Vencimiento del Soporte</label>
            <input type="date" class="form-control" value="2027-12-31">
          </div>
        </div>
      </form>
    </div>
    <div class="card-footer bg-light d-flex justify-content-between py-4 px-5">
      <button type="button" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Atrás</button>
      <button type="submit" form="formRegistro" class="btn btn-verde text-white px-5">Guardar Registro y Continuar</button>
    </div>
  </div>
</div>
</body>
</html>
