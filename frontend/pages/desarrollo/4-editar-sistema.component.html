<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso 4 - Editar Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --color-verde-ctic: #1abb9c; --color-azul-ctic: #0f75bc; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; }
    .container-form { max-width: 1100px; margin: 2rem auto; animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .card-custom { border: none; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
    .card-header-main { background: linear-gradient(135deg, var(--color-azul-ctic), #0a5a9c); color: white; padding: 1.25rem 1.75rem; border-radius: 16px 16px 0 0; }
    .section-title { border-left: 5px solid #ffc107; padding-left: 10px; font-weight: 700; color: #212529; margin-bottom: 1.5rem; }
    .btn-verde { background-color: var(--color-verde-ctic); border: none; padding: 10px 24px; font-weight: 600; border-radius: 8px; color: white; }
    .btn-verde:hover { background-color: #16a589; color: white; }
  </style>
</head>
<body>
<div class="container-form">
  <div class="card card-custom">
    <div class="card-header-main text-white d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <i class="bi bi-pencil-square me-3 fs-3"></i>
        <h5 class="mb-0 fw-bold">4. Modificación de Ficha Técnica de Sistema</h5>
      </div>
      <span class="badge bg-warning text-dark fw-bold px-3 py-2">Modo Edición</span>
    </div>
    <div class="card-body p-4 p-md-5">
      <form id="formEdicion" onsubmit="event.preventDefault(); alert('✅ Cambios en el expediente técnico actualizados con éxito en el servidor.');">
        
        <h6 class="section-title">Actualización de Datos Generales Precargados</h6>
        <div class="row g-4">
          <div class="col-md-4">
            <label class="form-label fw-bold">Código Único (No Editable)</label>
            <input type="text" class="form-control bg-light border-secondary-subtle" value="SIS-TEST-99" readonly>
          </div>
          <div class="col-md-8">
            <label class="form-label fw-bold">Nombre del Sistema</label>
            <input type="text" class="form-control" value="Sistema SGI Prueba">
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Descripción Operativa</label>
            <textarea class="form-control" rows="3">Validación y diagnóstico de las llaves foráneas integradas en la matriz de persistencia local mediante la inyección del script init.sql.</textarea>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Clasificación del Aplicativo</label>
            <select class="form-select">
              <option selected value="WEB">Aplicativo Web Interno / Intranet</option>
              <option value="DESKTOP">Aplicación de Escritorio</option>
              <option value="API">API REST Core</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Criticidad</label>
            <select class="form-select">
              <option selected value="ALTO">Alto (Impacto Crítico)</option>
              <option value="MEDIO">Medio</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Estado en el Flujo</label>
            <input type="text" class="form-control bg-light text-danger fw-bold" value="OBSERVADO POR EL CTIC" readonly>
          </div>
        </div>
      </form>
    </div>
    <div class="card-footer bg-light d-flex justify-content-between py-4 px-5">
      <button type="button" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Cancelar</button>
      <button type="submit" form="formEdicion" class="btn btn-verde text-white px-5">Actualizar y Continuar</button>
    </div>
  </div>
</div>
</body>
</html>
