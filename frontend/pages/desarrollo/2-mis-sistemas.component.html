<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso 2 - Mis Sistemas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --color-verde-ctic: #1abb9c; --color-azul-ctic: #0f75bc; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; }
    .container-sistemas { max-width: 1200px; margin: 2rem auto; animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .card-custom { border: none; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
    .card-header-main { background: linear-gradient(135deg, var(--color-azul-ctic), #0a5a9c); color: white; padding: 1.25rem 1.75rem; border-radius: 16px 16px 0 0; }
    .table-custom th { font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; color: #5c6873; background-color: #f1f3f5; padding: 1.1rem 1rem; }
    .table-custom td { padding: 1.25rem 1rem; vertical-align: middle; }
    .btn-verde { background-color: var(--color-verde-ctic); border: none; padding: 10px 24px; font-weight: 600; border-radius: 8px; color: white; }
    .btn-verde:hover { background-color: #16a589; color: white; }
  </style>
</head>
<body>
<div class="container-sistemas">
  <div class="card card-custom">
    <div class="card-header-main d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <i class="bi bi-list-task me-3 fs-3"></i>
        <h5 class="mb-0 fw-bold">2. Gestión de Inventario Oficial (Mis Sistemas)</h5>
      </div>
      <button class="btn btn-light btn-sm fw-bold px-3 shadow-sm"><i class="bi bi-plus-circle me-2"></i>+ Nuevo Registro</button>
    </div>
    <div class="card-body p-4 p-md-5">
      
      <!-- Barra de búsqueda y filtros avanzados (RF-29) -->
      <div class="row g-3 mb-4 p-4 bg-light rounded-3 border">
        <div class="col-md-4">
          <label class="form-label fw-bold small text-secondary">Buscar Aplicativo</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" placeholder="Nombre, código o tecnología...">
          </div>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold small text-secondary">Criticidad Institutional</label>
          <select class="form-select">
            <option selected>Todos</option>
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold small text-secondary">Estado Levantamiento</label>
          <select class="form-select">
            <option selected>Todos</option>
            <option>Borrador</option>
            <option>Pendiente Validación</option>
            <option>Validado</option>
            <option>Observado</option>
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-secondary w-100 fw-bold"><i class="bi bi-funnel"></i> Filtrar</button>
        </div>
      </div>

      <!-- Tabla de Sistemas -->
      <div class="table-responsive">
        <table class="table table-hover table-custom align-middle">
          <thead>
            <tr>
              <th>Código Único</th>
              <th>Nombre del Sistema</th>
              <th>Área Usuaria</th>
              <th>Criticidad</th>
              <th>Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><span class="fw-bold text-dark">SIS-TEST-99</span></td>
              <td>Sistema SGI Prueba</td>
              <td>CTIC Corporativo</td>
              <td><span class="badge bg-danger">Alto</span></td>
              <td><span class="badge bg-warning text-dark">Observado</span></td>
              <td class="text-center">
                <div class="btn-group gap-2">
                  <button class="btn btn-sm btn-outline-primary" title="Editar Ficha"><i class="bi bi-pencil-fill"></i></button>
                  <button class="btn btn-sm btn-outline-dark" title="Ver Historial de Auditoría"><i class="bi bi-clock-history"></i></button>
                  <!-- Simulación eliminación lógica (RF-33) -->
                  <button class="btn btn-sm btn-outline-danger" onclick="alert('✅ RN-11: Se aplica eliminación lógica. El registro cambia a estado INACTIVO pero se conserva para trazabilidad de la OCI.')" title="Eliminación Lógica"><i class="bi bi-trash3-fill"></i></button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card-footer bg-light d-flex justify-content-between py-4 px-5">
      <button class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Regresar al Dashboard</button>
      <button class="btn btn-verde text-white px-5">Siguiente Paso <i class="bi bi-arrow-right ms-2"></i></button>
    </div>
  </div>
</div>
</body>
</html>
