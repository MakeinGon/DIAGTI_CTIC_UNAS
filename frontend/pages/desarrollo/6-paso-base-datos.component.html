<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso 6 - Ficha de Base de Datos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --color-verde-ctic: #1abb9c; --color-azul-ctic: #0f75bc; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; }
    .container-bd { max-width: 1100px; margin: 2rem auto; animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .card-custom { border: none; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
    .card-header-main { background: linear-gradient(135deg, var(--color-azul-ctic), #0a5a9c); color: white; padding: 1.25rem 1.75rem; border-radius: 16px 16px 0 0; }
    .section-title { border-left: 5px solid var(--color-verde-ctic); padding-left: 10px; font-weight: 700; color: #212529; margin-bottom: 1.5rem; }
    .btn-verde { background-color: var(--color-verde-ctic); border: none; padding: 10px 24px; font-weight: 600; border-radius: 8px; color: white; }
    .btn-verde:hover { background-color: #16a589; color: white; }
  </style>
</head>
<body>
<div class="container-bd">
  <div class="card card-custom">
    <div class="card-header-main text-white">
      <div class="d-flex align-items-center">
        <i class="bi bi-database-fill me-3 fs-3"></i>
        <h5 class="mb-0 fw-bold">6. Registro y Asociación de Motores de Base de Datos</h5>
      </div>
    </div>
    <div class="card-body p-4 p-md-5">
      <form id="formBD" onsubmit="event.preventDefault(); alert('✅ Datos de motor de persistencia y políticas de respaldo vinculados con éxito.');">
        
        <h6 class="section-title">Infraestructura de Persistencia Relacional / NoRelacional (RF-08)</h6>
        <div class="row g-4">
          <div class="col-md-4">
            <label class="form-label fw-bold">Motor de Base de Datos <span class="text-danger">*</span></label>
            <select class="form-select" required>
              <option selected value="PostgreSQL">PostgreSQL (Estándar RNF-09)</option>
              <option value="MySQL">MySQL Server</option>
              <option value="Oracle">Oracle Database Enterprise</option>
              <option value="SQLServer">Microsoft SQL Server</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Versión del Motor <span class="text-danger">*</span></label>
            <input type="text" class="form-control" value="17.10 (Debian)" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Tipo de Base de Datos</label>
            <input type="text" class="form-control" value="Relacional Transaccional" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Servidor de Alojamiento (IP / Host) <span class="text-danger">*</span></label>
            <input type="text" class="form-control" placeholder="Ej: 192.168.10.45" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Nombre del Esquema o Instancia <span class="text-danger">*</span></label>
            <input type="text" class="form-control" placeholder="Ej: diagti_db" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Frecuencia de Respaldos Automáticos</label>
            <select class="form-select">
              <option selected>Batch Diario Automatizado (Madrugadas)</option>
              <option>Batch Semanal Integrado</option>
              <option>Copias de Respaldo Continuas (A Demanda)</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">¿Cuenta con Cifrado en Persistencia?</label>
            <select class="form-select">
              <option selected>Sí (Cifrado AES de campos críticos)</option>
              <option>No cuenta con cifrado activo</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Responsable de Administración de BD</label>
            <input type="text" class="form-control" value="Área de Desarrollo / Infraestructura CTIC">
          </div>
        </div>
      </form>
    </div>
    <div class="card-footer bg-light d-flex justify-content-between py-4 px-5">
      <button type="button" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Atrás</button>
      <button type="submit" form="formBD" class="btn btn-verde text-white px-5">Guardar Ficha Técnica y Continuar</button>
    </div>
  </div>
</div>
</body>
</html>
