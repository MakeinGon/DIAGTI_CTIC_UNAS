<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Infraestructura</title>

<style>

:root{
    --color-verde-ctic:#1abb9c;
    --color-azul-ctic:#0f75bc;
    --fondo:#f4f6f9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:var(--fondo);
}

/*============== MENU ==============*/

.sidebar{

    width:250px;
    background:var(--color-azul-ctic);
    color:white;
    height:100vh;
    position:fixed;

}

.logo{

    text-align:center;
    font-size:28px;
    font-weight:bold;
    padding:25px;
    border-bottom:1px solid rgba(255,255,255,.2);

}

.sidebar ul{

    list-style:none;

}

.sidebar li a{

    color:white;
    text-decoration:none;
    display:block;
    padding:15px 20px;

}

.sidebar li a:hover{

    background:#0c5c95;

}

.active{

    background:#0c5c95;

}

/*============== CONTENIDO ==============*/

.main{

    margin-left:250px;
    width:calc(100% - 250px);
    padding:25px;

}

.card{

    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);

}

h1{

    color:#0f75bc;
    margin-bottom:20px;

}

.grid{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;

}

label{

    font-weight:bold;

}

input,select{

    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;

}

button{

    margin-top:20px;
    padding:10px 18px;
    border:none;
    border-radius:5px;
    cursor:pointer;

}

.btn{

    background:#1abb9c;
    color:white;

}

.btn:hover{

    opacity:.9;

}

table{

    width:100%;
    border-collapse:collapse;
    margin-top:30px;

}

th{

    background:#0f75bc;
    color:white;
    padding:10px;

}

td{

    padding:10px;
    border:1px solid #ddd;

}

.editar{

    background:#1abb9c;
    color:white;
    border:none;
    padding:8px 10px;
    cursor:pointer;
    border-radius:5px;

}

.eliminar{

    background:#e74c3c;
    color:white;
    border:none;
    padding:8px 10px;
    cursor:pointer;
    border-radius:5px;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

CTIC

</div>

<ul>

<li><a href="dashboard.html"> Dashboard</a></li>

<li><a href="mis-sistemas.html"> Mis Sistemas</a></li>

<li class="active"><a href="infraestructura.html"> Infraestructura</a></li>

<li><a href="despliegue.html"> Despliegue</a></li>

<li><a href="seguridad.html"> Seguridad</a></li>

<li><a href="evidencias.html"> Evidencias</a></li>

<li><a href="validacion.html"> Enviar Validación</a></li>

<li><a href="subsanaciones.html"> Subsanaciones</a></li>

<li><a href="historial.html"> Historial</a></li>

</ul>

</div>

<div class="main">

<div class="card">

<h1>Registro de Infraestructura</h1>

<div class="grid">

<div>

<label>Sistema</label>

<input id="sistema">

</div>

<div>

<label>Servidor</label>

<input id="servidor">

</div>

<div>

<label>IP</label>

<input id="ip">

</div>

<div>

<label>Sistema Operativo</label>

<input id="so">

</div>

<div>

<label>Docker</label>

<select id="docker">

<option>Sí</option>

<option>No</option>

</select>

</div>

<div>

<label>Proxmox</label>

<select id="proxmox">

<option>Sí</option>

<option>No</option>

</select>

</div>

<div>

<label>CPU</label>

<input id="cpu">

</div>

<div>

<label>RAM</label>

<input id="ram">

</div>

<div>

<label>Almacenamiento</label>

<input id="disco">

</div>

</div>

<button class="btn" onclick="guardar()">

Guardar Infraestructura

</button>

<table id="tabla">

<thead>

<tr>

<th>Sistema</th>

<th>Servidor</th>

<th>IP</th>

<th>SO</th>

<th>Docker</th>

<th>Acciones</th>

</tr>

</thead>

<tbody>

<tr>

<td>Biblioteca</td>

<td>srv-biblio</td>

<td>10.10.1.12</td>

<td>Ubuntu 24</td>

<td>Sí</td>

<td>

<button class="editar" onclick="editar(this)">Editar</button>

<button class="eliminar" onclick="eliminar(this)">Eliminar</button>

</td>

</tr>
 
</tbody>

</table>

</div>

</div>

<script>

function guardar(){

    let sistema=document.getElementById("sistema").value;
    let servidor=document.getElementById("servidor").value;
    let ip=document.getElementById("ip").value;
    let so=document.getElementById("so").value;
    let docker=document.getElementById("docker").value;

    if(sistema=="" || servidor=="" || ip==""){

        alert("Complete los campos obligatorios.");
        return;

    }

    let tabla=document.getElementById("tabla").getElementsByTagName("tbody")[0];

    let fila=tabla.insertRow();

    fila.insertCell(0).innerHTML=sistema;
    fila.insertCell(1).innerHTML=servidor;
    fila.insertCell(2).innerHTML=ip;
    fila.insertCell(3).innerHTML=so;
    fila.insertCell(4).innerHTML=docker;

    fila.insertCell(5).innerHTML=
    '<button class="editar" onclick="editar(this)">Editar</button> '+
    '<button class="eliminar" onclick="eliminar(this)">Eliminar</button>';

    document.getElementById("sistema").value="";
    document.getElementById("servidor").value="";
    document.getElementById("ip").value="";
    document.getElementById("so").value="";
    document.getElementById("cpu").value="";
    document.getElementById("ram").value="";
    document.getElementById("disco").value="";

}

function editar(btn){

    let fila=btn.parentNode.parentNode;

    let sistema=prompt("Sistema",fila.cells[0].innerHTML);
    let servidor=prompt("Servidor",fila.cells[1].innerHTML);
    let ip=prompt("IP",fila.cells[2].innerHTML);
    let so=prompt("Sistema Operativo",fila.cells[3].innerHTML);
    let docker=prompt("Docker (Sí/No)",fila.cells[4].innerHTML);

    if(sistema!=null) fila.cells[0].innerHTML=sistema;
    if(servidor!=null) fila.cells[1].innerHTML=servidor;
    if(ip!=null) fila.cells[2].innerHTML=ip;
    if(so!=null) fila.cells[3].innerHTML=so;
    if(docker!=null) fila.cells[4].innerHTML=docker;

}

function eliminar(btn){

    if(confirm("¿Desea eliminar este registro?")){

        btn.parentNode.parentNode.remove();

    }

}

</script>

</body>
</html>
