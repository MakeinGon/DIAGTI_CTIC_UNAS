<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Despliegue</title>

<style>

:root{
    --color-verde-ctic:#1abb9c;
    --color-azul-ctic:#0f75bc;
    --fondo:#f4f6f9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:var(--fondo);
}

/* MENU */

.sidebar{
    width:250px;
    height:100vh;
    background:var(--color-azul-ctic);
    position:fixed;
    color:white;
}

.logo{
    padding:25px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,.2);
}

.sidebar ul{
    list-style:none;
}

.sidebar li a{
    color:white;
    display:block;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar li a:hover{
    background:#0b5c96;
}

.active{
    background:#0b5c96;
}

/* CONTENIDO */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
    color:#0f75bc;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

.btn{
    margin-top:20px;
    background:#1abb9c;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:5px;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}

table{
    width:100%;
    margin-top:25px;
    border-collapse:collapse;
}

th{
    background:#0f75bc;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border:1px solid #ddd;
}

.editar{
    background:#1abb9c;
    color:white;
    border:none;
    padding:7px 12px;
    border-radius:5px;
    cursor:pointer;
}

.eliminar{
    background:#e74c3c;
    color:white;
    border:none;
    padding:7px 12px;
    border-radius:5px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
CTIC
</div>

<ul>

<li><a href="dashboard.html"> Dashboard</a></li>
<li><a href="mis-sistemas.html"> Mis Sistemas</a></li>
<li><a href="infraestructura.html"> Infraestructura</a></li>
<li class="active"><a href="despliegue.html"> Despliegue</a></li>
<li><a href="seguridad.html"> Seguridad</a></li>
<li><a href="evidencias.html"> Evidencias</a></li>
<li><a href="validacion.html"> Enviar Validación</a></li>
<li><a href="subsanaciones.html"> Subsanaciones</a></li>
<li><a href="historial.html"> Historial</a></li>

</ul>

</div>

<div class="main">

<div class="card">

<h1>Registro de Despliegue</h1>

<div class="grid">

<div>

<label>Sistema</label>
<input id="sistema">

</div>

<div>

<label>Ambiente</label>

<select id="ambiente">
<option>Desarrollo</option>
<option>Pruebas</option>
<option>Producción</option>
</select>

</div>

<div>

<label>Servidor</label>
<input id="servidor">

</div>

<div>

<label>Dominio</label>
<input id="dominio">

</div>

<div>

<label>Puerto</label>
<input id="puerto">

</div>

<div>

<label>Docker Compose</label>

<select id="docker">
<option>Sí</option>
<option>No</option>
</select>

</div>

<div>

<label>Servidor Web</label>

<select id="web">
<option>Nginx</option>
<option>Apache</option>
<option>IIS</option>
</select>

</div>

<div>

<label>CI/CD</label>

<select id="cicd">
<option>Sí</option>
<option>No</option>
</select>

</div>

</div>

<button class="btn" onclick="guardar()">
Guardar Despliegue
</button>

<table id="tabla">

<thead>

<tr>

<th>Sistema</th>
<th>Ambiente</th>
<th>Servidor</th>
<th>Dominio</th>
<th>Puerto</th>
<th>Acciones</th>

</tr>

</thead>

<tbody>

<tr>

<td>Matrícula</td>
<td>Producción</td>
<td>srv-matricula</td>
<td>matricula.unas.edu.pe</td>
<td>443</td>

<td>

<button class="editar" onclick="editar(this)">
Editar
</button>

<button class="eliminar" onclick="eliminar(this)">
Eliminar
</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>

function guardar(){

    let sistema=document.getElementById("sistema").value;
    let ambiente=document.getElementById("ambiente").value;
    let servidor=document.getElementById("servidor").value;
    let dominio=document.getElementById("dominio").value;
    let puerto=document.getElementById("puerto").value;

    if(sistema=="" || servidor=="" || dominio==""){

        alert("Complete todos los campos obligatorios.");
        return;

    }

    let tabla=document.getElementById("tabla").getElementsByTagName("tbody")[0];

    let fila=tabla.insertRow();

    fila.insertCell(0).innerHTML=sistema;
    fila.insertCell(1).innerHTML=ambiente;
    fila.insertCell(2).innerHTML=servidor;
    fila.insertCell(3).innerHTML=dominio;
    fila.insertCell(4).innerHTML=puerto;

    fila.insertCell(5).innerHTML=
    '<button class="editar" onclick="editar(this)">Editar</button> '+
    '<button class="eliminar" onclick="eliminar(this)">Eliminar</button>';

    document.getElementById("sistema").value="";
    document.getElementById("servidor").value="";
    document.getElementById("dominio").value="";
    document.getElementById("puerto").value="";

}

function editar(btn){

    let fila=btn.parentNode.parentNode;

    let sistema=prompt("Sistema",fila.cells[0].innerHTML);
    let ambiente=prompt("Ambiente",fila.cells[1].innerHTML);
    let servidor=prompt("Servidor",fila.cells[2].innerHTML);
    let dominio=prompt("Dominio",fila.cells[3].innerHTML);
    let puerto=prompt("Puerto",fila.cells[4].innerHTML);

    if(sistema!=null) fila.cells[0].innerHTML=sistema;
    if(ambiente!=null) fila.cells[1].innerHTML=ambiente;
    if(servidor!=null) fila.cells[2].innerHTML=servidor;
    if(dominio!=null) fila.cells[3].innerHTML=dominio;
    if(puerto!=null) fila.cells[4].innerHTML=puerto;

}

function eliminar(btn){

    if(confirm("¿Desea eliminar este despliegue?")){

        btn.parentNode.parentNode.remove();

    }

}

</script>

</body>
</html>
