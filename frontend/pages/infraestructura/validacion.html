<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Enviar Validación</title>

<style>

:root{
--color-verde-ctic:#1abb9c;
--color-azul-ctic:#0f75bc;
--fondo:#f4f6f9;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:var(--fondo);
}

/******** MENU ********/

.sidebar{
width:250px;
height:100vh;
background:var(--color-azul-ctic);
position:fixed;
color:white;
}

.logo{
padding:25px;
font-size:28px;
font-weight:bold;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.2);
}

.sidebar ul{
list-style:none;
}

.sidebar li a{
display:block;
padding:15px 20px;
text-decoration:none;
color:white;
}

.sidebar li a:hover{
background:#0b5d96;
}

.active{
background:#0b5d96;
}

/******** CONTENIDO ********/

.main{
margin-left:250px;
width:calc(100% - 250px);
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

label{
font-weight:bold;
}

input,select,textarea{

width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;

}

textarea{

height:120px;
resize:none;

}

.btn{

margin-top:20px;
padding:10px 18px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;

}

.aprobar{

background:#27ae60;

}

.rechazar{

background:#e74c3c;

}

.subsanar{

background:#f39c12;

}

table{

width:100%;
margin-top:30px;
border-collapse:collapse;

}

th{

background:#0f75bc;
color:white;
padding:10px;

}

td{

padding:10px;
border:1px solid #ddd;

}

.estado{

padding:5px 10px;
border-radius:20px;
color:white;
font-size:12px;

}

.enviado{

background:#3498db;

}

.aprobado{

background:#27ae60;

}

.rechazado{

background:#e74c3c;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

CTIC

</div>

<ul>

<li><a href="dashboard.html"> Dashboard</a></li>
<li><a href="mis-sistemas.html"> Mis Sistemas</a></li>
<li><a href="infraestructura.html"> Infraestructura</a></li>
<li><a href="despliegue.html"> Despliegue</a></li>
<li><a href="seguridad.html"> Seguridad</a></li>
<li><a href="evidencias.html"> Evidencias</a></li>
<li class="active"><a href="validacion.html"> Enviar Validación</a></li>
<li><a href="subsanaciones.html"> Subsanaciones</a></li>
<li><a href="historial.html"> Historial</a></li>

</ul>

</div>

<div class="main">

<div class="card">

<h2>Validación de Infraestructura</h2>

<div class="grid">

<div>

<label>Sistema</label>

<select id="sistema">

<option>Biblioteca</option>
<option>Matrícula</option>
<option>Mesa de Partes</option>
<option>RRHH</option>

</select>

</div>

<div>

<label>Estado</label>

<select id="estado">

<option>Enviado</option>
<option>Aprobado</option>
<option>Rechazado</option>
<option>Subsanación</option>

</select>

</div>

<div style="grid-column:1/3;">

<label>Observaciones</label>

<textarea id="obs"></textarea>

</div>

</div>

<button class="btn aprobar" onclick="aprobar()">

Aprobar

</button>

<button class="btn rechazar" onclick="rechazar()">

Rechazar

</button>

<button class="btn subsanar" onclick="subsanar()">

Solicitar Subsanación

</button>

<table id="tabla">

<thead>

<tr>

<th>Sistema</th>
<th>Estado</th>
<th>Observación</th>
<th>Fecha</th>

</tr>

</thead>

<tbody>

<tr>

<td>Biblioteca</td>

<td>

<span class="estado enviado">

Enviado

</span>

</td>

<td>Pendiente de revisión.</td>

<td>15/07/2026</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>

function fechaActual(){

    let hoy=new Date();

    let d=String(hoy.getDate()).padStart(2,"0");
    let m=String(hoy.getMonth()+1).padStart(2,"0");
    let a=hoy.getFullYear();

    return d+"/"+m+"/"+a;

}

function registrar(estado,color){

    let sistema=document.getElementById("sistema").value;
    let obs=document.getElementById("obs").value;

    if(obs==""){

        obs="Sin observaciones.";

    }

    let tabla=document.getElementById("tabla")
    .getElementsByTagName("tbody")[0];

    let fila=tabla.insertRow();

    fila.insertCell(0).innerHTML=sistema;

    fila.insertCell(1).innerHTML=
    '<span class="estado '+color+'">'+estado+'</span>';

    fila.insertCell(2).innerHTML=obs;

    fila.insertCell(3).innerHTML=fechaActual();

    document.getElementById("obs").value="";

    alert("Validación registrada correctamente.");

}

function aprobar(){

    registrar("Aprobado","aprobado");

}

function rechazar(){

    registrar("Rechazado","rechazado");

}

function subsanar(){

    registrar("Subsanación","enviado");

}

</script>

</body>
</html>
