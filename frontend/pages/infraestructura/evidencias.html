<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evidencias</title>

<style>

:root{
--color-verde-ctic:#1abb9c;
--color-azul-ctic:#0f75bc;
--fondo:#f4f6f9;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:var(--fondo);
}

/******** MENU ********/

.sidebar{
width:250px;
height:100vh;
background:var(--color-azul-ctic);
position:fixed;
color:white;
}

.logo{
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
border-bottom:1px solid rgba(255,255,255,.2);
}

.sidebar ul{
list-style:none;
}

.sidebar li a{
display:block;
padding:15px 20px;
text-decoration:none;
color:white;
}

.sidebar li a:hover{
background:#0c5c95;
}

.active{
background:#0c5c95;
}

/******** CONTENIDO ********/

.main{
margin-left:250px;
width:calc(100% - 250px);
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
color:#0f75bc;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

label{
font-weight:bold;
}

input,select,textarea{

width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;

}

textarea{

height:90px;
resize:none;

}

.btn{

margin-top:20px;
background:#1abb9c;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;

}

.btn:hover{

opacity:.9;

}

table{

width:100%;
margin-top:25px;
border-collapse:collapse;

}

th{

background:#0f75bc;
color:white;
padding:10px;

}

td{

padding:10px;
border:1px solid #ddd;

}

.editar{

background:#1abb9c;
color:white;
padding:7px 12px;
border:none;
border-radius:5px;
cursor:pointer;

}

.eliminar{

background:#e74c3c;
color:white;
padding:7px 12px;
border:none;
border-radius:5px;
cursor:pointer;

}

.descargar{

background:#3498db;
color:white;
padding:7px 12px;
border:none;
border-radius:5px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
CTIC
</div>

<ul>

<li><a href="dashboard.html"> Dashboard</a></li>

<li><a href="mis-sistemas.html"> Mis Sistemas</a></li>

<li><a href="infraestructura.html"> Infraestructura</a></li>

<li><a href="despliegue.html"> Despliegue</a></li>

<li><a href="seguridad.html"> Seguridad</a></li>

<li class="active"><a href="evidencias.html"> Evidencias</a></li>

<li><a href="validacion.html"> Enviar Validación</a></li>

<li><a href="subsanaciones.html"> Subsanaciones</a></li>

<li><a href="historial.html"> Historial</a></li>

</ul>

</div>

<div class="main">

<div class="card">

<h1>Registro de Evidencias</h1>

<div class="grid">

<div>

<label>Sistema</label>

<input id="sistema">

</div>

<div>

<label>Tipo de Evidencia</label>

<select id="tipo">

<option>Captura</option>
<option>Documento</option>
<option>Contrato</option>
<option>Certificado</option>
<option>Repositorio Git</option>
<option>URL</option>

</select>

</div>

<div>

<label>Nombre del Archivo</label>

<input id="archivo">

</div>

<div>

<label>URL</label>

<input id="url">

</div>

<div style="grid-column:1/3;">

<label>Descripción</label>

<textarea id="descripcion"></textarea>

</div>

</div>

<button class="btn" onclick="guardar()">

Guardar Evidencia

</button>

<table id="tabla">

<thead>

<tr>

<th>Sistema</th>
<th>Tipo</th>
<th>Archivo</th>
<th>URL</th>
<th>Acciones</th>

</tr>

</thead>

<tbody>

<tr>

<td>Biblioteca</td>

<td>Captura</td>

<td>pantalla_login.png</td>

<td>https://repositorio.unas.edu.pe</td>

<td>

<button class="editar" onclick="editar(this)">
Editar
</button>

<button class="descargar" onclick="descargar(this)">
Descargar
</button>

<button class="eliminar" onclick="eliminar(this)">
Eliminar
</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>

function guardar(){

    let sistema=document.getElementById("sistema").value;
    let tipo=document.getElementById("tipo").value;
    let archivo=document.getElementById("archivo").value;
    let url=document.getElementById("url").value;

    if(sistema=="" || archivo==""){

        alert("Complete los campos obligatorios.");
        return;

    }

    let tabla=document.getElementById("tabla")
    .getElementsByTagName("tbody")[0];

    let fila=tabla.insertRow();

    fila.insertCell(0).innerHTML=sistema;
    fila.insertCell(1).innerHTML=tipo;
    fila.insertCell(2).innerHTML=archivo;
    fila.insertCell(3).innerHTML=url;

    fila.insertCell(4).innerHTML=
    '<button class="editar" onclick="editar(this)">Editar</button> '+
    '<button class="descargar" onclick="descargar(this)">Descargar</button> '+
    '<button class="eliminar" onclick="eliminar(this)">Eliminar</button>';

    document.getElementById("sistema").value="";
    document.getElementById("archivo").value="";
    document.getElementById("url").value="";
    document.getElementById("descripcion").value="";
    document.getElementById("tipo").selectedIndex=0;

}

function editar(btn){

    let fila=btn.parentNode.parentNode;

    let sistema=prompt("Sistema",fila.cells[0].innerHTML);
    let tipo=prompt("Tipo",fila.cells[1].innerHTML);
    let archivo=prompt("Archivo",fila.cells[2].innerHTML);
    let url=prompt("URL",fila.cells[3].innerHTML);

    if(sistema!=null) fila.cells[0].innerHTML=sistema;
    if(tipo!=null) fila.cells[1].innerHTML=tipo;
    if(archivo!=null) fila.cells[2].innerHTML=archivo;
    if(url!=null) fila.cells[3].innerHTML=url;

}

function descargar(btn){

    let fila=btn.parentNode.parentNode;

    alert(
        "Descargando: " +
        fila.cells[2].innerHTML +
        "\n\n(Esta es una simulación, no hay archivos reales.)"
    );

}

function eliminar(btn){

    if(confirm("¿Desea eliminar esta evidencia?")){

        btn.parentNode.parentNode.remove();

    }

}

</script>

</body>
</html>
