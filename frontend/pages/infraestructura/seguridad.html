<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Seguridad</title>

<style>

:root{
    --color-verde-ctic:#1abb9c;
    --color-azul-ctic:#0f75bc;
    --fondo:#f4f6f9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:var(--fondo);
}

/************ MENU ************/

.sidebar{

    width:250px;
    height:100vh;
    position:fixed;
    background:var(--color-azul-ctic);
    color:white;

}

.logo{

    padding:25px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,.2);

}

.sidebar ul{

    list-style:none;

}

.sidebar li a{

    color:white;
    text-decoration:none;
    display:block;
    padding:15px 20px;

}

.sidebar li a:hover{

    background:#0c5d96;

}

.active{

    background:#0c5d96;

}

/************ CONTENIDO ************/

.main{

    margin-left:250px;
    width:calc(100% - 250px);
    padding:25px;

}

.card{

    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);

}

h1{

    color:#0f75bc;
    margin-bottom:20px;

}

.grid{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;

}

label{

    font-weight:bold;

}

input,select{

    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;

}

.btn{

    margin-top:20px;
    background:#1abb9c;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;

}

.btn:hover{

    opacity:.9;

}

table{

    width:100%;
    margin-top:30px;
    border-collapse:collapse;

}

th{

    background:#0f75bc;
    color:white;
    padding:10px;

}

td{

    padding:10px;
    border:1px solid #ddd;

}

.editar{

    background:#1abb9c;
    color:white;
    border:none;
    padding:7px 12px;
    border-radius:5px;
    cursor:pointer;

}

.eliminar{

    background:#e74c3c;
    color:white;
    border:none;
    padding:7px 12px;
    border-radius:5px;
    cursor:pointer;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

CTIC

</div>

<ul>

<li><a href="dashboard.html"> Dashboard</a></li>

<li><a href="mis-sistemas.html"> Mis Sistemas</a></li>

<li><a href="infraestructura.html"> Infraestructura</a></li>

<li><a href="despliegue.html"> Despliegue</a></li>

<li class="active"><a href="seguridad.html"> Seguridad</a></li>

<li><a href="evidencias.html"> Evidencias</a></li>

<li><a href="validacion.html"> Enviar Validación</a></li>

<li><a href="subsanaciones.html"> Subsanaciones</a></li>

<li><a href="historial.html"> Historial</a></li>

</ul>

</div>

<div class="main">

<div class="card">

<h1>Controles de Seguridad</h1>

<div class="grid">

<div>

<label>Sistema</label>

<input id="sistema">

</div>

<div>

<label>SSL / TLS</label>

<select id="ssl">

<option>Cumple</option>
<option>Parcial</option>
<option>No Cumple</option>

</select>

</div>

<div>

<label>Firewall</label>

<select id="firewall">

<option>Sí</option>
<option>No</option>

</select>

</div>

<div>

<label>MFA</label>

<select id="mfa">

<option>Sí</option>
<option>No</option>

</select>

</div>

<div>

<label>Logs</label>

<select id="logs">

<option>Sí</option>
<option>No</option>

</select>

</div>

<div>

<label>Auditoría</label>

<select id="auditoria">

<option>Sí</option>
<option>No</option>

</select>

</div>

<div>

<label>OWASP</label>

<select id="owasp">

<option>Cumple</option>
<option>Parcial</option>
<option>No Cumple</option>

</select>

</div>

<div>

<label>Cifrado</label>

<select id="cifrado">

<option>Sí</option>
<option>No</option>

</select>

</div>

<div>

<label>Restricción por IP</label>

<select id="ip">

<option>Sí</option>
<option>No</option>

</select>

</div>

</div>

<button class="btn" onclick="guardar()">

Guardar Seguridad

</button>

<table id="tabla">

<thead>

<tr>

<th>Sistema</th>
<th>SSL</th>
<th>Firewall</th>
<th>MFA</th>
<th>OWASP</th>
<th>Acciones</th>

</tr>

</thead>

<tbody>

<tr>

<td>Biblioteca</td>
<td>Cumple</td>
<td>Sí</td>
<td>Sí</td>
<td>Cumple</td>

<td>

<button class="editar" onclick="editar(this)">
Editar
</button>

<button class="eliminar" onclick="eliminar(this)">
Eliminar
</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>

function guardar(){

    let sistema=document.getElementById("sistema").value;
    let ssl=document.getElementById("ssl").value;
    let firewall=document.getElementById("firewall").value;
    let mfa=document.getElementById("mfa").value;
    let owasp=document.getElementById("owasp").value;

    if(sistema==""){

        alert("Ingrese el nombre del sistema.");
        return;

    }

    let tabla=document.getElementById("tabla").getElementsByTagName("tbody")[0];

    let fila=tabla.insertRow();

    fila.insertCell(0).innerHTML=sistema;
    fila.insertCell(1).innerHTML=ssl;
    fila.insertCell(2).innerHTML=firewall;
    fila.insertCell(3).innerHTML=mfa;
    fila.insertCell(4).innerHTML=owasp;

    fila.insertCell(5).innerHTML=
    '<button class="editar" onclick="editar(this)">Editar</button> '+
    '<button class="eliminar" onclick="eliminar(this)">Eliminar</button>';

    document.getElementById("sistema").value="";
    document.getElementById("ssl").selectedIndex=0;
    document.getElementById("firewall").selectedIndex=0;
    document.getElementById("mfa").selectedIndex=0;
    document.getElementById("logs").selectedIndex=0;
    document.getElementById("auditoria").selectedIndex=0;
    document.getElementById("owasp").selectedIndex=0;
    document.getElementById("cifrado").selectedIndex=0;
    document.getElementById("ip").selectedIndex=0;

}

function editar(btn){

    let fila=btn.parentNode.parentNode;

    let sistema=prompt("Sistema",fila.cells[0].innerHTML);
    let ssl=prompt("SSL/TLS",fila.cells[1].innerHTML);
    let firewall=prompt("Firewall",fila.cells[2].innerHTML);
    let mfa=prompt("MFA",fila.cells[3].innerHTML);
    let owasp=prompt("OWASP",fila.cells[4].innerHTML);

    if(sistema!=null) fila.cells[0].innerHTML=sistema;
    if(ssl!=null) fila.cells[1].innerHTML=ssl;
    if(firewall!=null) fila.cells[2].innerHTML=firewall;
    if(mfa!=null) fila.cells[3].innerHTML=mfa;
    if(owasp!=null) fila.cells[4].innerHTML=owasp;

}

function eliminar(btn){

    if(confirm("¿Desea eliminar este registro de seguridad?")){

        btn.parentNode.parentNode.remove();

    }

}

</script>

</body>
</html>
