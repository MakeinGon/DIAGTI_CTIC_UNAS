<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Subsanaciones</title>

<style>

:root{
--color-verde-ctic:#1abb9c;
--color-azul-ctic:#0f75bc;
--fondo:#f5f6fa;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:var(--fondo);
}

/* MENU */

.sidebar{
width:250px;
height:100vh;
background:#0f75bc;
position:fixed;
color:white;
}

.logo{
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
border-bottom:1px solid rgba(255,255,255,.2);
}

.sidebar ul{
list-style:none;
}

.sidebar li a{
display:block;
padding:15px 20px;
text-decoration:none;
color:white;
}

.sidebar li a:hover{
background:#0b5d96;
}

.active{
background:#0b5d96;
}

/* CONTENIDO */

.main{
margin-left:250px;
width:calc(100% - 250px);
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

label{
font-weight:bold;
}

input,select,textarea{

width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;

}

textarea{

height:100px;
resize:none;

}

.btn{

margin-top:20px;
background:#1abb9c;
color:white;
padding:10px 18px;
border:none;
border-radius:5px;
cursor:pointer;

}

table{

width:100%;
margin-top:25px;
border-collapse:collapse;

}

th{

background:#0f75bc;
color:white;
padding:10px;

}

td{

padding:10px;
border:1px solid #ddd;

}

.editar{

background:#1abb9c;
color:white;
padding:7px 12px;
border:none;
border-radius:5px;
cursor:pointer;

}

.eliminar{

background:#e74c3c;
color:white;
padding:7px 12px;
border:none;
border-radius:5px;
cursor:pointer;

}

.estado{

padding:5px 10px;
border-radius:15px;
color:white;

}

.pendiente{

background:#f39c12;

}

.corregido{

background:#27ae60;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

CTIC

</div>

<ul>

<li><a href="dashboard.html"> Dashboard</a></li>
<li><a href="mis-sistemas.html"> Mis Sistemas</a></li>
<li><a href="infraestructura.html"> Infraestructura</a></li>
<li><a href="despliegue.html"> Despliegue</a></li>
<li><a href="seguridad.html"> Seguridad</a></li>
<li><a href="evidencias.html"> Evidencias</a></li>
<li><a href="validacion.html"> Enviar Validación</a></li>
<li class="active"><a href="subsanaciones.html"> Subsanaciones</a></li>
<li><a href="historial.html"> Historial</a></li>

</ul>

</div>

<div class="main">

<div class="card">

<h2>Registro de Subsanaciones</h2>

<div class="grid">

<div>

<label>Sistema</label>

<input id="sistema">

</div>

<div>

<label>Estado</label>

<select id="estado">

<option>Pendiente</option>
<option>Corregido</option>

</select>

</div>

<div style="grid-column:1/3;">

<label>Observación</label>

<textarea id="observacion"></textarea>

</div>

</div>

<button class="btn" onclick="guardar()">

Guardar

</button>

<table id="tabla">

<thead>

<tr>

<th>Sistema</th>
<th>Estado</th>
<th>Observación</th>
<th>Acciones</th>

</tr>

</thead>

<tbody>

<tr>

<td>Biblioteca</td>

<td>

<span class="estado pendiente">

Pendiente

</span>

</td>

<td>Actualizar certificado SSL.</td>

<td>

<button class="editar" onclick="editar(this)">
Editar
</button>

<button class="eliminar" onclick="eliminar(this)">
Eliminar
</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>

function guardar(){

    let sistema=document.getElementById("sistema").value;
    let estado=document.getElementById("estado").value;
    let observacion=document.getElementById("observacion").value;

    if(sistema=="" || observacion==""){

        alert("Complete todos los campos.");
        return;

    }

    let claseEstado=(estado=="Pendiente")?"pendiente":"corregido";

    let tabla=document.getElementById("tabla")
    .getElementsByTagName("tbody")[0];

    let fila=tabla.insertRow();

    fila.insertCell(0).innerHTML=sistema;

    fila.insertCell(1).innerHTML=
    '<span class="estado '+claseEstado+'">'+estado+'</span>';

    fila.insertCell(2).innerHTML=observacion;

    fila.insertCell(3).innerHTML=
    '<button class="editar" onclick="editar(this)">Editar</button> '+
    '<button class="eliminar" onclick="eliminar(this)">Eliminar</button>';

    document.getElementById("sistema").value="";
    document.getElementById("estado").selectedIndex=0;
    document.getElementById("observacion").value="";

    alert("Subsanación registrada correctamente.");

}

function editar(btn){

    let fila=btn.parentNode.parentNode;

    let sistema=prompt("Sistema:",fila.cells[0].innerText);

    let estado=prompt("Estado (Pendiente o Corregido):",
                      fila.cells[1].innerText);

    let observacion=prompt("Observación:",
                           fila.cells[2].innerText);

    if(sistema!=null)
        fila.cells[0].innerText=sistema;

    if(estado!=null){

        let clase=(estado=="Pendiente")?
        "pendiente":"corregido";

        fila.cells[1].innerHTML=
        '<span class="estado '+clase+'">'+estado+'</span>';

    }

    if(observacion!=null)
        fila.cells[2].innerText=observacion;

}

function eliminar(btn){

    if(confirm("¿Desea eliminar esta subsanación?")){

        btn.parentNode.parentNode.remove();

    }

}

</script>

</body>

</html>
