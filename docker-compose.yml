services:
  # ============================================
  # POSTGRESQL - BASE DE DATOS
  # ============================================
  postgres:
    image: postgres:17
    container_name: diagti_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - diagti_postgres_data:/var/lib/postgresql/data
      - ./DataBase:/docker-entrypoint-initdb.d
    networks:
      - diagti_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BACKEND - SPRING BOOT
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diagti_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
    ports:
      - "8080:8080"
    networks:
      - diagti_network
    volumes:
      - ./backend/logs:/app/logs

  # ============================================
  # FRONTEND - SERVIDOR WEB (Opcional)
  # ============================================
  frontend:
    image: nginx:alpine
    container_name: diagti_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - diagti_network

# ============================================
# REDES Y VOLÚMENES
# ============================================
networks:
  diagti_network:
    driver: bridge

volumes:
  diagti_postgres_data:
